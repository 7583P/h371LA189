name: Bug Report
description: Report a bug or unexpected behavior in Hill Adventurer
title: "[BUG]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much factual information as possible to help reproduce the issue.
  - type: dropdown
    id: environment
    attributes:
      label: Target Environment
      description: Where did this bug occur?
      options:
        - Windows Standalone (DirectX 11)
        - Android (Physical Device)
        - Unity Editor (6000.3.13f1)
    validations:
      required: true
  - type: dropdown
    id: game_mode
    attributes:
      label: Game Mode / Scene
      description: Which scene or mode was active?
      options:
        - MainMenu
        - Garage / Customization
        - PreStart Menu
        - Adventure 2.5D (Countryside)
        - Adventure 3D
        - TimeTrial 3D
        - Tools / CompetitiveQA Lab
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Select vehicle '...'
        3. Press '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen under normal conditions.
    validations:
      required: true
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Logs, Diagnostics, or Screenshots
      description: Paste relevant Unity Editor console logs, Player.log snippets, or attach screenshots. (Do NOT include passwords or private keys).
