name: Secret Scanning (Gitleaks)

on:
  push:
    branches: [ "main", "oss-readiness" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scan-secrets:
    name: Gitleaks Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
